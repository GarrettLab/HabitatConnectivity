default:
  CCRI parameters:
    Habitat: "maize-density.tif"
    HabitatDensityThreshold: [0.0025]
    AggregationStrategy: [mean]
    DistanceStrategy: "geodesic"
    Resolution: 24
    GeoExtent: 
      global: FALSE
      customExt: [-125, -25, -60, 60] # ignored, when global = TRUE
    LinkThreshold: [0.0001]
    DispersalKernelModels:
      InversePowerLaw:
        beta: [0.5, 1, 1.5]
      NegativeExponential:
        gamma: []
    NetworkMetrics:
      InversePowerLaw:
        metrics: ["node_strength"]
        weights: [100]
        cutoff: -1
      NegativeExponential:
        metrics: []
        weights: []
        cutoff: -1
    PriorityMaps:
      OutDir:
      MeanCC: TRUE
      Difference: TRUE
      Variance: TRUE
